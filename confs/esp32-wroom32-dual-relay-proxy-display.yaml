# ESP32 WROOM32 Dual Relay Board with Proxy Support and CH1116 Display
# This configuration provides dual relay control with proxy UART support and OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# UART Configuration for Proxy
uart:
  - id: uart_ecodan
    rx_pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
    tx_pin:
      number: GPIO2
      mode:
        output: true
    baud_rate: 2400
    parity: EVEN
    stop_bits: 1
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\n"
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ' ');

  - id: uart_proxy
    rx_pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
    tx_pin:
      number: GPIO17
      mode:
        output: true
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   after:
    #     delimiter: "\n"
    #   sequence:
    #     - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_large
    size: 12
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_medium
    size: 11
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_small
    size: 9

# CH1116 OLED Display (130x64 pixels) - Normal orientation
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: false
    update_interval: 2s
    lambda: |-
      // Normal display: 128x64 (width x height)
      // CH1116 is 130x64, so we have 2 extra pixels on the right
      int offset_x = 2;  // Account for CH1116's 2-pixel offset
      it.fill(Color::BLACK);

      // --- Header Line ---
      it.printf(0 + offset_x, 0, id(font_small), "IP: %s", id(wifi_ip).state.c_str());
      
      // WiFi Signal (top right)
      int signal_strength = id(wifi_signal_strength).state;
      int base_x = 110;  // X position for WiFi bars
      int base_y = 8;   // Y base position (bottom of bars)
      // Bar 1 (Always present)
      it.filled_rectangle(base_x, base_y - 2, 2, 2, Color::WHITE);
      // Bar 2 (Fair signal)
      if (signal_strength > -80) it.filled_rectangle(base_x + 4, base_y - 4, 2, 4, Color::WHITE);
      // Bar 3 (Good signal)
      if (signal_strength > -70) it.filled_rectangle(base_x + 8, base_y - 6, 2, 6, Color::WHITE);
      // Bar 4 (Strong signal)
      if (signal_strength > -60) it.filled_rectangle(base_x + 12, base_y - 8, 2, 8, Color::WHITE);

      // --- Grid Line ---
      it.line(0 + offset_x, 10, 128, 10);  // Horizontal line after ESP info

      // --- Heat Pump Mode Section (Left) ---
      it.printf(0 + offset_x, 12, id(font_medium), "HP Status");
      it.printf(0 + offset_x, 26, id(font_medium), "%s", id(hp_mode).state.c_str());

      // --- Smart Grid Mode Section (Left) ---
      it.line(0, 38, 62, 38);
      it.line(62, 10, 62, 64);
      it.printf(0 + offset_x, 40, id(font_medium), "Smart Grid");
      std::string level_text;
      if (id(smart_grid_level).state == 0) level_text = "Normal";
      else if (id(smart_grid_level).state == 1) level_text = "Reduced";
      else if (id(smart_grid_level).state == 2) level_text = "Stop";
      else level_text = "Boost";
      it.printf(0 + offset_x, 52, id(font_medium), "%d:%s", (int) id(smart_grid_level).state, level_text.c_str());

      // --- Right Column (All Temperatures) ---
      it.printf(66, 12, id(font_medium), "Flw:");
      it.printf(94, 12, id(font_medium), "%.1f°C", id(flow_temp_display).state);
      it.printf(66, 24, id(font_medium), "Ret:");
      it.printf(94, 24, id(font_medium), "%.1f°C", id(return_temp_display).state);
      it.printf(66, 40, id(font_medium), "DHW:");
      it.printf(94, 40, id(font_medium), "%.1f°C", id(dhw_temp_display).state);
      it.printf(66, 52, id(font_medium), "Out:");
      it.printf(94, 52, id(font_medium), "%.1f°C", id(outdoor_temp_display).state);

      // --- Bottom Row (Relay Status & Uptime) ---
      it.printf(0 + offset_x, 58, id(font_small), "R1:%s R2:%s", 
                id(relay1).state ? "ON" : "OFF", 
                id(relay2).state ? "ON" : "OFF");
      
      int uptime_hours = id(esp_uptime).state / 3600;
      it.printf(66, 58, id(font_small), "Uptime: %dh", uptime_hours);

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    ecodan_id: ecodan_instance
    z1_feed_temp:
      id: flow_temp_display
      name: "Flow Temperature Display"
    z1_return_temp:
      id: return_temp_display
      name: "Return Temperature Display"
    dhw_temp:
      id: dhw_temp_display
      name: "DHW Temperature Display"
    outside_temp:
      id: outdoor_temp_display
      name: "Outdoor Temperature Display"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
