# ESP32 WROOM32 Dual Relay Board with Proxy Support and CH1116 Display
# This configuration provides dual relay control with proxy UART support and OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# UART Configuration for Proxy
uart:
  - id: uart_ecodan
    rx_pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
    tx_pin:
      number: GPIO2
      mode:
        output: true
    baud_rate: 2400
    parity: EVEN
    stop_bits: 1
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\n"
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ' ');

  - id: uart_proxy
    rx_pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
    tx_pin:
      number: GPIO17
      mode:
        output: true
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   after:
    #     delimiter: "\n"
    #   sequence:
    #     - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "gfonts://JetBrains Mono"
    id: font_large
    size: 12
  - file: "gfonts://JetBrains Mono"
    id: font_medium
    size: 10
  - file: "gfonts://JetBrains Mono"
    id: font_small
    size: 9
  - file: "gfonts://JetBrains Mono"
    id: font_tiny
    size: 7

# CH1116 OLED Display (130x64 pixels) - Normal orientation
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: false
    update_interval: 2s
    lambda: |-
      // Optimized for oval/pill viewport (128x64), content centered and compact
      int offset_x = 2;  // CH1116 right-offset
      int char_width = 6;
      it.fill(Color::BLACK);



      // We have 4 rows to display information on the display
      int y1 = 2;
      int y2 = 18;
      int y3 = 34;
      int y4 = 50;

      // We have 2 columns in the middle 2 rows
      int col1_x = 14 + offset_x;
      int col2_x = 72 + offset_x;

      // Row 1 -------------------------------------------------------------
      // Heat pump mode (left)
      std::string mode_text = id(hp_mode).state.c_str();
      if (mode_text.size() > 10) mode_text = mode_text.substr(0, 10);
      it.printf(col1_x+char_width, y1, id(font_small), "%s", mode_text.c_str());

      // Smart Grid level with SG prefix (right side)
      int level = (int) id(smart_grid_level).state;
      int sg_x = col2_x + char_width;
      it.printf(sg_x, y1, id(font_small), "SG");
      it.rectangle(sg_x + char_width*2, y1, 12, 13);
      it.printf(sg_x + char_width*2 + 3, y1, id(font_small), "%d", level);  // Centered in 12px box

      // Relays as horizontal boxes (after SG)
      bool r1 = id(relay1).state;
      bool r2 = id(relay2).state;
      int rx = sg_x + char_width * 4+1;
      
      // Relay 1 (top horizontal box)
      it.rectangle(rx, y1, 6, 6);
      if (r1) it.filled_rectangle(rx + 1, y1 + 2, 6, 2, Color::WHITE);
      
      // Relay 2 (bottom horizontal box)
      it.rectangle(rx, y1 + 7, 6, 6);
      if (r2) it.filled_rectangle(rx + 1, y1 + 6, 6, 2, Color::WHITE);

      // Row 2 -------------------------------------------------------------
      // Flow (Flw)
      it.printf(col1_x, y2, id(font_small), "Flw");
      it.printf(col1_x + 24, y2, id(font_small), "%.1f°", id(flow_temp_display).state);

      // Return (Ret)
      it.printf(col2_x, y2, id(font_small), "Ret");
      it.printf(col2_x + 24, y2, id(font_small), "%.1f°", id(return_temp_display).state);

      // Row 3 -------------------------------------------------------------
      // DHW (Dhw)
      it.printf(col1_x, y3, id(font_small), "Dhw");
      it.printf(col1_x + 24, y3, id(font_small), "%.1f°", id(dhw_temp_display).state);

      // Outdoor (Out)
      it.printf(col2_x, y3, id(font_small), "Out");
      it.printf(col2_x + 24, y3, id(font_small), "%.1f°", id(outdoor_temp_display).state);

      // Row 4 -------------------------------------------------------------
      // IP address (Left)
      std::string ip_text = id(wifi_ip).state.c_str();
      if (ip_text.size() > 16) ip_text = ip_text.substr(0, 16);
      it.printf(col1_x+char_width, y4, id(font_small), "%s", ip_text.c_str());

      // WiFi bars (Center)
      int signal_strength = (int) id(wifi_signal_strength).state;
      int wifi_x = col2_x + 5 * char_width;
      int wifi_y = y4+8;
      it.filled_rectangle(wifi_x, wifi_y, 2, 2, Color::WHITE);
      if (signal_strength > -80) it.filled_rectangle(wifi_x-1, wifi_y - 2, 4, 1, Color::WHITE);
      if (signal_strength > -70) it.filled_rectangle(wifi_x-2, wifi_y - 3, 6, 1, Color::WHITE);
      if (signal_strength > -60) it.filled_rectangle(wifi_x-3, wifi_y - 4, 8, 1, Color::WHITE);
      if (signal_strength > -60) it.filled_rectangle(wifi_x-1, wifi_y - 5, 4, 1, Color::WHITE);

      // Uptime (right)
      //int uptime_hours = id(esp_uptime).state / 3600;
      //it.printf(col2_x + 30, y4, id(font_small), "%dh", uptime_hours);

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    ecodan_id: ecodan_instance
    z1_feed_temp:
      id: flow_temp_display
      name: "Flow Temperature Display"
    z1_return_temp:
      id: return_temp_display
      name: "Return Temperature Display"
    dhw_temp:
      id: dhw_temp_display
      name: "DHW Temperature Display"
    outside_temp:
      id: outdoor_temp_display
      name: "Outdoor Temperature Display"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
