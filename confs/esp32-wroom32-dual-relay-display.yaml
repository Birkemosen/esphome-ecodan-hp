# ESP32 WROOM32 Dual Relay Board with CH1116 Display Configuration
# This configuration provides dual relay control with CH1116 OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_large
    size: 12
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_medium
    size: 11
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_small
    size: 9

# CH1116 OLED Display (130x64 pixels)
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: true
    update_interval: 2s
    lambda: |-
      // CH1116 is 130x64, so we have 2 extra pixels on the right
      // We'll use offset_x to shift content 2 pixels to the right to avoid garbled pixels
      int offset_x = 2;  // 2-pixel offset for CH1116
      it.fill(Color::BLACK);

      // --- IP Address (Top Right) ---
      it.printf(0 + offset_x, 0, id(font_small), "IP: %s", id(wifi_ip).state.c_str());

      // --- WiFi Signal Bars (2x2, 2x4, 2x6, 2x8) ---
      int signal_strength = id(wifi_signal_strength).state;
      int base_x = 108;  // Adjusted for CH1116 width (130px vs 128px)
      int base_y = 8;   // Y base position (bottom of bars)

      // Bar 1 (Always present)
      it.filled_rectangle(base_x, base_y - 2, 2, 2, Color::WHITE);
      // Bar 2 (Fair signal)
      if (signal_strength > -80) it.filled_rectangle(base_x + 4, base_y - 4, 2, 4, Color::WHITE);
      // Bar 3 (Good signal)
      if (signal_strength > -70) it.filled_rectangle(base_x + 8, base_y - 6, 2, 6, Color::WHITE);
      // Bar 4 (Strong signal)
      if (signal_strength > -60) it.filled_rectangle(base_x + 12, base_y - 8, 2, 8, Color::WHITE);
      

      // --- Grid Line ---
      it.line(0 + offset_x, 10, 128, 10);  // Horizontal line after ESP info

      // --- Heat Pump Mode Section (Left) ---
      it.printf(0 + offset_x, 12, id(font_medium), "${hp_status}");
      it.printf(0 + offset_x, 26, id(font_medium), "%s", id(hp_mode).state.c_str());

      // --- Smart Grid Mode Section (Left) ---
      it.line(0 + offset_x, 38, 62 + offset_x, 38);
      it.line(62 + offset_x, 10, 62 + offset_x, 64);
      it.printf(0 + offset_x, 40, id(font_medium), "${smart_grid}");
      std::string level_text;
      if (id(smart_grid_level).state == 0) level_text = "${smart_grid_normal}";
      else if (id(smart_grid_level).state == 1) level_text = "${smart_grid_reduced}";
      else if (id(smart_grid_level).state == 2) level_text = "${smart_grid_stop}";
      else level_text = "${smart_grid_boost}";
      it.printf(0 + offset_x, 52, id(font_medium), "%d:%s", (int) id(smart_grid_level).state, level_text.c_str());

      // --- Right Column (All Temperatures) ---
      it.printf(66 + offset_x, 12, id(font_medium), "${flow_temp}:");
      it.printf(94 + offset_x, 12, id(font_medium), "%.1f°C", id(flow_temp).state);
      
      it.printf(66 + offset_x, 24, id(font_medium), "${return_temp}:");
      it.printf(94 + offset_x, 24, id(font_medium), "%.1f°C", id(return_temp).state);

      it.printf(66 + offset_x, 40, id(font_medium), "${dhw_temp}:");
      it.printf(94 + offset_x, 40, id(font_medium), "%.1f°C", id(dhw_temp).state);

      it.printf(66 + offset_x, 52, id(font_medium), "${outdoor_temp}:");
      it.printf(94 + offset_x, 52, id(font_medium), "%.1f°C", id(outdoor_temp).state);

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    z1_feed_temp:
      id: flow_temp
      name: "Flow Temperature"
    z1_return_temp:
      id: return_temp
      name: "Return Temperature"
    dhw_temp:
      id: dhw_temp
      name: "DHW Temperature"
    outdoor_temp:
      id: outside_temp
      name: "Outdoor Temperature"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
