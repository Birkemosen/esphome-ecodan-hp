# ESP32 WROOM32 Dual Relay Board with CH1116 Display Configuration
# This configuration provides dual relay control with CH1116 OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_large
    size: 12
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_medium
    size: 11
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_small
    size: 9

# CH1116 OLED Display (130x64 pixels) - Rotated 90 degrees
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: true
    rotation: 90  # Rotate display 90 degrees
    update_interval: 2s
    lambda: |-
      // Rotated display: 64x128 (height x width)
      // CH1116 is 130x64, rotated becomes 64x130
      it.fill(Color::BLACK);

      // --- Header Line ---
      it.printf(0, 0, id(font_small), "IP: %s", id(wifi_ip).state.c_str());
      
      // WiFi Signal (top right)
      int signal_strength = id(wifi_signal_strength).state;
      int base_x = 58;
      int base_y = 2;
      if (signal_strength > -80) it.filled_rectangle(base_x, base_y, 2, 2, Color::WHITE);
      if (signal_strength > -70) it.filled_rectangle(base_x + 3, base_y, 2, 4, Color::WHITE);
      if (signal_strength > -60) it.filled_rectangle(base_x + 6, base_y, 2, 6, Color::WHITE);
      if (signal_strength > -50) it.filled_rectangle(base_x + 9, base_y, 2, 8, Color::WHITE);

      // --- Main Content (Vertical List) ---
      it.line(0, 10, 64, 10);  // Separator line

      // Heat Pump Status
      it.printf(0, 12, id(font_small), "Heat Pump:");
      it.printf(0, 22, id(font_medium), "%s", id(hp_mode).state.c_str());

      // Temperature Readings
      it.printf(0, 32, id(font_small), "Flow: %.1f°C", id(flow_temp_display).state);
      it.printf(0, 42, id(font_small), "Return: %.1f°C", id(return_temp_display).state);
      it.printf(0, 52, id(font_small), "DHW: %.1f°C", id(dhw_temp_display).state);
      it.printf(0, 62, id(font_small), "Outdoor: %.1f°C", id(outdoor_temp_display).state);

      // Smart Grid Status
      it.printf(0, 72, id(font_small), "Smart Grid:");
      std::string level_text;
      if (id(smart_grid_level).state == 0) level_text = "Normal";
      else if (id(smart_grid_level).state == 1) level_text = "Reduced";
      else if (id(smart_grid_level).state == 2) level_text = "Stop";
      else level_text = "Boost";
      it.printf(0, 82, id(font_medium), "Level %d: %s", (int) id(smart_grid_level).state, level_text.c_str());

      // Relay Status
      it.printf(0, 92, id(font_small), "Relays: R1=%s R2=%s", 
                id(relay1).state ? "ON" : "OFF", 
                id(relay2).state ? "ON" : "OFF");

      // System Info
      int uptime_hours = id(esp_uptime).state / 3600;
      it.printf(0, 102, id(font_small), "Uptime: %dh", uptime_hours);
      it.printf(0, 112, id(font_small), "WiFi: %ddBm", signal_strength);

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    ecodan_id: ecodan_instance
    z1_feed_temp:
      id: flow_temp_display
      name: "Flow Temperature Display"
    z1_return_temp:
      id: return_temp_display
      name: "Return Temperature Display"
    dhw_temp:
      id: dhw_temp_display
      name: "DHW Temperature Display"
    outside_temp:
      id: outdoor_temp_display
      name: "Outdoor Temperature Display"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
