# ESP32 WROOM32 Dual Relay Board with CH1116 Display Configuration
# This configuration provides dual relay control with CH1116 OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_large
    size: 12
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_medium
    size: 11
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_small
    size: 9

# CH1116 OLED Display (130x64 pixels) - Normal orientation
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: false
    update_interval: 2s
    lambda: |-
      // Optimized for oval/pill viewport (128x64), content centered and compact
      int offset_x = 2;  // CH1116 right-offset
      it.fill(Color::BLACK);

      // Top row: WiFi bars and Heat pump mode
      int signal_strength = (int) id(wifi_signal_strength).state;
      int wifi_x = 4 + offset_x;
      int wifi_y = 8;
      it.filled_rectangle(wifi_x + 0, wifi_y - 2, 2, 2, Color::WHITE);
      if (signal_strength > -80) it.filled_rectangle(wifi_x + 4, wifi_y - 4, 2, 4, Color::WHITE);
      if (signal_strength > -70) it.filled_rectangle(wifi_x + 8, wifi_y - 6, 2, 6, Color::WHITE);
      if (signal_strength > -60) it.filled_rectangle(wifi_x + 12, wifi_y - 8, 2, 8, Color::WHITE);

      // Heat pump mode (top-center)
      std::string mode_text = id(hp_mode).state.c_str();
      if (mode_text.size() > 12) mode_text = mode_text.substr(0, 12);
      int mode_x = 64 + offset_x - (int) (mode_text.size() * 5) / 2;
      it.printf(mode_x, 2, id(font_small), "%s", mode_text.c_str());

      // Two rows of temps with three-letter labels
      int y1 = 16;
      int y2 = 32;

      // Flow (FLO)
      it.printf(18 + offset_x, y1, id(font_small), "FLO");
      it.printf(42 + offset_x, y1, id(font_small), "%.1f°", id(flow_temp_display).state);

      // Return (RET)
      it.printf(74 + offset_x, y1, id(font_small), "RET");
      it.printf(98 + offset_x, y1, id(font_small), "%.1f°", id(return_temp_display).state);

      // DHW (DHW)
      it.printf(18 + offset_x, y2, id(font_small), "DHW");
      it.printf(42 + offset_x, y2, id(font_small), "%.1f°", id(dhw_temp_display).state);

      // Outdoor (OUT)
      it.printf(74 + offset_x, y2, id(font_small), "OUT");
      it.printf(98 + offset_x, y2, id(font_small), "%.1f°", id(outdoor_temp_display).state);

      // Middle row: Smart Grid and Relays
      int ym = 48;

      // Smart Grid level with SG prefix
      int level = (int) id(smart_grid_level).state;
      int sgx = 18 + offset_x;
      int sgy = ym - 6;
      it.printf(sgx, sgy + 2, id(font_small), "SG");
      it.rectangle(sgx + 18, sgy, 12, 10);
      it.printf(sgx + 21, sgy + 2, id(font_small), "%d", level);

      // Relays as stacked boxes after SG
      bool r1 = id(relay1).state;
      bool r2 = id(relay2).state;
      int rx = sgx + 35;
      
      // Relay 1 (top box)
      it.rectangle(rx, sgy - 2, 8, 6);
      if (r1) it.filled_rectangle(rx + 1, sgy - 1, 6, 4, Color::WHITE);
      
      // Relay 2 (bottom box)
      it.rectangle(rx, sgy + 2, 8, 6);
      if (r2) it.filled_rectangle(rx + 1, sgy + 3, 6, 4, Color::WHITE);

      // Bottom row: IP and Uptime
      int yb = 58;
      
      // IP address (left)
      std::string ip_text = id(wifi_ip).state.c_str();
      if (ip_text.size() > 12) ip_text = ip_text.substr(0, 12);
      it.printf(4 + offset_x, yb, id(font_small), "%s", ip_text.c_str());
      
      // Uptime (right)
      int uptime_hours = id(esp_uptime).state / 3600;
      it.printf(90 + offset_x, yb, id(font_small), "%dh", uptime_hours);

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    ecodan_id: ecodan_instance
    z1_feed_temp:
      id: flow_temp_display
      name: "Flow Temperature Display"
    z1_return_temp:
      id: return_temp_display
      name: "Return Temperature Display"
    dhw_temp:
      id: dhw_temp_display
      name: "DHW Temperature Display"
    outside_temp:
      id: outdoor_temp_display
      name: "Outdoor Temperature Display"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
