# ESP32 WROOM32 Dual Relay Board with CH1116 Display Configuration
# This configuration provides dual relay control with CH1116 OLED display

# I2C Configuration for OLED Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz

# Relay Outputs
output:
  - platform: gpio
    pin: GPIO25
    id: relay1_output
  - platform: gpio
    pin: GPIO26
    id: relay2_output

# Relay Switches
switch:
  - platform: output
    name: "Relay 1"
    output: relay1_output
    id: relay1
  - platform: output
    name: "Relay 2"
    output: relay2_output
    id: relay2

# Time for display
time:
  - platform: homeassistant

# Fonts for display
font:
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_large
    size: 12
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_medium
    size: 11
  - file: "fonts/UbuntuMono-Regular.ttf"
    id: font_small
    size: 9

# CH1116 OLED Display (130x64 pixels) - Normal orientation
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106 128x64"  # Use SH1106 model as CH1116 is compatible
    address: 0x3C
    invert: false
    update_interval: 2s
    lambda: |-
      // Optimized for oval/pill viewport (128x64), content centered and compact
      int offset_x = 2;  // CH1116 right-offset
      it.fill(Color::BLACK);

      // WiFi bars (left-center)
      int signal_strength = (int) id(wifi_signal_strength).state;
      int wifi_x = 4 + offset_x;
      int wifi_y = 36;
      it.filled_rectangle(wifi_x + 0, wifi_y - 2, 2, 2, Color::WHITE);
      if (signal_strength > -80) it.filled_rectangle(wifi_x + 4, wifi_y - 4, 2, 4, Color::WHITE);
      if (signal_strength > -70) it.filled_rectangle(wifi_x + 8, wifi_y - 6, 2, 6, Color::WHITE);
      if (signal_strength > -60) it.filled_rectangle(wifi_x + 12, wifi_y - 8, 2, 8, Color::WHITE);

      // Heat pump mode (small, top-center, truncated)
      std::string mode_text = id(hp_mode).state.c_str();
      if (mode_text.size() > 10) mode_text = mode_text.substr(0, 10);
      int mode_x = 64 + offset_x - (int) (mode_text.size() * 6) / 2;  // approx width per char @ size 9
      it.printf(mode_x, 2, id(font_small), "%s", mode_text.c_str());

      // Two rows of temps, compact labels
      int y1 = 14;
      int y2 = 30;

      // Flow (F)
      it.printf(22 + offset_x, y1, id(font_small), "F");
      it.printf(32 + offset_x, y1, id(font_small), "%.1f°", id(flow_temp_display).state);

      // Return (R)
      it.printf(78 + offset_x, y1, id(font_small), "R");
      it.printf(88 + offset_x, y1, id(font_small), "%.1f°", id(return_temp_display).state);

      // DHW (D)
      it.printf(22 + offset_x, y2, id(font_small), "D");
      it.printf(32 + offset_x, y2, id(font_small), "%.1f°", id(dhw_temp_display).state);

      // Outdoor (O)
      it.printf(78 + offset_x, y2, id(font_small), "O");
      it.printf(88 + offset_x, y2, id(font_small), "%.1f°", id(outdoor_temp_display).state);

      // Bottom row: Relays, Uptime, Smart Grid level
      int yb = 50;

      // Relays (two squares)
      bool r1 = id(relay1).state;
      bool r2 = id(relay2).state;
      int rx = 22 + offset_x;
      it.printf(rx - 10, yb, id(font_small), "R");
      it.rectangle(rx, yb - 6, 10, 10);
      if (r1) it.filled_rectangle(rx + 2, yb - 4, 6, 6, Color::WHITE);
      rx += 14;
      it.rectangle(rx, yb - 6, 10, 10);
      if (r2) it.filled_rectangle(rx + 2, yb - 4, 6, 6, Color::WHITE);

      // Uptime (center-bottom)
      int uptime_hours = id(esp_uptime).state / 3600;
      it.printf(56 + offset_x, yb, id(font_small), "U%dh", uptime_hours);

      // Smart Grid level (four bars)
      int level = (int) id(smart_grid_level).state;
      int sgx = 96 + offset_x;
      for (int i = 0; i < 4; i++) {
        if (i < level) {
          it.filled_rectangle(sgx + i * 8, yb - 6, 6, 10, Color::WHITE);
        } else {
          it.rectangle(sgx + i * 8, yb - 6, 6, 10);
        }
      }

# Text sensors for display
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

  - platform: ecodan
    heat_source_text:
      id: hp_mode
      name: "Heat Pump Mode"

# Sensors for display
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 30s
  - platform: ecodan
    ecodan_id: ecodan_instance
    z1_feed_temp:
      id: flow_temp_display
      name: "Flow Temperature Display"
    z1_return_temp:
      id: return_temp_display
      name: "Return Temperature Display"
    dhw_temp:
      id: dhw_temp_display
      name: "DHW Temperature Display"
    outside_temp:
      id: outdoor_temp_display
      name: "Outdoor Temperature Display"

# Smart Grid Level Control
number:
  - platform: template
    name: "Smart Grid Level"
    id: smart_grid_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          // Control relays based on Smart Grid level
          if (id(smart_grid_level).state == 0) {
            id(relay1).turn_off();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 1) {
            id(relay1).turn_on();
            id(relay2).turn_off();
          } else if (id(smart_grid_level).state == 2) {
            id(relay1).turn_off();
            id(relay2).turn_on();
          } else if (id(smart_grid_level).state == 3) {
            id(relay1).turn_on();
            id(relay2).turn_on();
          }
